<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${action} + ' Car - Car Manager'">Car Form</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>
<div class="container">
    <nav class="navbar">
        <div class="nav-brand">🚗 Car Manager</div>
        <div class="nav-right">
            <a th:href="@{/cars}" class="btn btn-outline">← Back to List</a>
        </div>
    </nav>

    <div class="content">
        <h2 th:text="${action} + ' Car'">Car Form</h2>

        <div class="form-card">
            <form method="post"
                  th:action="${action == 'Add'} ? @{/cars/add} : @{/cars/edit/{id}(id=${car.id})}"
                  th:object="${car}">
                <div class="form-group">
                    <label for="name">Car Name</label>
                    <input type="text" id="name" th:field="*{name}" required placeholder="e.g. Camry"/>
                </div>
                <div class="form-group">
                    <label for="brand">Brand</label>
                    <input type="text" id="brand" th:field="*{brand}" required placeholder="e.g. Toyota"/>
                </div>
                <div class="form-group">
                    <label for="year">Year</label>
                    <input type="number" id="year" th:field="*{year}" required min="1900" max="2030"
                           placeholder="e.g. 2024"/>
                </div>
                <div class="form-group">
                    <label for="color">Color</label>
                    <input type="text" id="color" th:field="*{color}" required placeholder="e.g. White"/>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" th:text="${action} + ' Car'">Save</button>
                    <a th:href="@{/cars}" class="btn btn-outline">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
