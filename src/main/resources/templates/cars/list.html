<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Car Management</title>
    <link href="/webjars/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="/cars"><i class="bi bi-car-front-fill"></i> Car Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-2">
                <li class="nav-item">
                    <span class="navbar-text text-white-50">Welcome, <span th:text="${fullName}">User</span></span>
                </li>
                <li class="nav-item">
                    <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">
    <div class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center mb-3 gap-2">
        <h4 class="mb-0">Car List</h4>
        <a th:href="@{/cars/add}" class="btn btn-success"><i class="bi bi-plus-lg"></i> Add Car</a>
    </div>

    <form method="get" th:action="@{/cars}" class="row g-2 mb-4">
        <div class="col">
            <input type="text" class="form-control" name="search" th:value="${search}" placeholder="Search by name, brand, year, or color..."/>
        </div>
        <div class="col-auto d-flex gap-2">
            <button type="submit" class="btn btn-primary"><i class="bi bi-search"></i> Search</button>
            <a th:href="@{/cars}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(cars)}" class="text-center py-5 bg-white rounded shadow-sm">
        <i class="bi bi-inbox display-4 text-muted"></i>
        <p class="text-muted mt-2">No cars found.</p>
    </div>

    <!-- Desktop table view -->
    <div th:unless="${#lists.isEmpty(cars)}" class="table-responsive d-none d-md-block">
        <table class="table table-striped table-hover bg-white shadow-sm rounded overflow-hidden">
            <thead class="table-dark">
            <tr>
                <th>#</th>
                <th>Name</th>
                <th>Brand</th>
                <th>Year</th>
                <th>Color</th>
                <th class="text-end">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="car, iter : ${cars}">
                <td th:text="${iter.index + 1}"></td>
                <td th:text="${car.name}"></td>
                <td th:text="${car.brand}"></td>
                <td th:text="${car.year}"></td>
                <td th:text="${car.color}"></td>
                <td class="text-end">
                    <a th:href="@{/cars/edit/{id}(id=${car.id})}" class="btn btn-warning btn-sm"><i class="bi bi-pencil"></i> Edit</a>
                    <a th:href="@{/cars/delete/{id}(id=${car.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this car?')"><i class="bi bi-trash"></i> Delete</a>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Mobile card view -->
    <div th:unless="${#lists.isEmpty(cars)}" class="d-md-none">
        <div th:each="car : ${cars}" class="card mb-3 shadow-sm">
            <div class="card-body">
                <h5 class="card-title" th:text="${car.name}"></h5>
                <p class="card-text mb-1"><strong>Brand:</strong> <span th:text="${car.brand}"></span></p>
                <p class="card-text mb-1"><strong>Year:</strong> <span th:text="${car.year}"></span></p>
                <p class="card-text mb-3"><strong>Color:</strong> <span th:text="${car.color}"></span></p>
                <div class="d-flex gap-2">
                    <a th:href="@{/cars/edit/{id}(id=${car.id})}" class="btn btn-warning btn-sm"><i class="bi bi-pencil"></i> Edit</a>
                    <a th:href="@{/cars/delete/{id}(id=${car.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this car?')"><i class="bi bi-trash"></i> Delete</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
</body>
</html>
